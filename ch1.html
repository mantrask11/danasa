<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CH1</title>
  <script src="https://cdn.jsdelivr.net/npm/tone"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 12px; }
    button { padding: 10px 20px; font-size: 15px; cursor: pointer; border: none; border-radius: 4px; color: white; }
    #playBtn { background: #1a73e8; }
    #stopBtn { background: #d93025; }
    #log { background: #f4f4f4; padding: 10px; border-left: 4px solid #1a73e8; font-family: monospace; margin-bottom: 15px; max-width: 800px; }

    /* Visible Full-Size High-Res Image */
    #originalImg {
      display: none; /* Stays hidden until an image is uploaded */
      width: auto;
      height: auto;
      max-width: none; /* Shows true 1:1 original pixel size */
      border: 2px solid #222;
      margin-top: 10px;
    }

    /* Invisible Canvas (Still processes RGB data in the background) */
    #imageCanvas {
      display: none;
    }
  </style>
</head>
<body>

  <h2>ONE.</h2>

  <div class="controls">
    <input type="file" id="imageLoader" accept="image/*" />
    <button id="playBtn">Play</button>
    <button id="stopBtn">Stop</button>
  </div>

  <

  <div id="log">Upload a PNG or JPG to view it at full size and hear its RGB colors.</div>

  <!-- VISIBLE HIGH-RES IMAGE -->
  <img id="originalImg" alt="Full-size uploaded image" />

  <!-- INVISIBLE PROCESSING CANVAS BELOW -->
  <canvas id="imageCanvas"></canvas>

  <script>
    const originalImg = document.getElementById('originalImg');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const imageLoader = document.getElementById('imageLoader');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const chunkval = 64
    const speedval = 0.2
    const logBox = document.getElementById('log');

    let loadedImg = null;
    let rawImageData = null;
    let chunkNotes = [];
    let activeSynth = null;

    const scale = [
      'C2', 'D2', 'E2', 'G2', 'A2',
      'C3', 'D3', 'E3', 'G3', 'A3',
      'C4', 'D4', 'E4', 'G4', 'A4',
      'C5', 'D5', 'E5', 'G5', 'A5', 'C6'
    ];

    
     // 1. Load image into the visible <img> and invisible <canvas>
    imageLoader.addEventListener('change', (e) => {
      const file = e.target.files.item(0);
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;

        // Show the high-res image on screen
        originalImg.src = dataUrl;
        originalImg.style.display = 'block';

        const img = new Image();
        img.onload = () => {
          loadedImg = img;

          // Draw onto the hidden canvas to extract RGB values
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);

          rawImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          extractChunkData();
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    });

    // 2. Group columns into chunks and average RGB
    function extractChunkData() {
      if (!rawImageData) return;

      const w = canvas.width;
      const h = canvas.height;
      const data = rawImageData.data;
      const numChunks = Math.min(w, parseInt(64, 10));
      const chunkWidth = w / numChunks;

      chunkNotes = [];

      for (let c = 0; c < numChunks; c++) {
        const startX = Math.floor(c * chunkWidth);
        const endX = Math.floor((c + 1) * chunkWidth);

        let rTotal = 0, gTotal = 0, bTotal = 0;
        let pixelCount = 0;

        for (let x = startX; x < endX; x++) {
          for (let y = 0; y < h; y++) {
            const i = (y * w + x) * 4;
            rTotal += data[i];
            gTotal += data[i + 1];
            bTotal += data[i + 2];
            pixelCount++;
          }
        }

        const rAvg = rTotal / pixelCount;
        const gAvg = gTotal / pixelCount;
        const bAvg = bTotal / pixelCount;

        const noteIdx = Math.min(scale.length - 1, Math.floor((rAvg / 256) * scale.length));
        const note = scale[noteIdx];
        const velocity = Math.max(0.2, gAvg / 255);
        const duration = bAvg > 150 ? '8n' : '16n';

        chunkNotes.push({ note, velocity, duration });
      }

      const estTime = (chunkNotes.length * parseFloat(0.2)).toFixed(1);
      logBox.textContent = `Loaded ${w}x${h}px image (${numChunks} musical chunks, ~${estTime}s). Click Play!`;
    }

    // 3. Play notes using Tone.js
    playBtn.addEventListener('click', async () => {
      if (chunkNotes.length === 0) return;
      stopPlayback();

      await Tone.start();
      activeSynth = new Tone.Synth().toDestination();

      const startTime = Tone.now();
      const step = parseFloat(0.2);

      chunkNotes.forEach((item, idx) => {
        activeSynth.triggerAttackRelease(item.note, item.duration, startTime + idx * step, item.velocity);
      });

      logBox.textContent = `Playing ${chunkNotes.length} chunks...`;
    });

    function stopPlayback() {
      if (activeSynth) {
        activeSynth.dispose();
        activeSynth = null;
      }
    }

    stopBtn.addEventListener('click', () => {
      stopPlayback();
      logBox.textContent = 'Playback stopped.';
    });
  </script>
</body>
</html>
