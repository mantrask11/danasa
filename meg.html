<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Platina: Information Jukebox</title>
  <link rel="stylesheet" href="meg.css">
</head>
<body>

  <header class="page-header">
    <div class="hud-badge">
      <span class="status-dot"></span>
      <span>SYS.ONLINE // CREDITS: NASA; </span>
    </div>
    <h1>Crew Platina</h1>
    <h2 class="subtitle">Earth Information Jukebox</h2>
  </header>

  <main class="main-content">
    <p class="instructions">
      Use <span class="key-cap">&larr;</span> <span class="key-cap">&rarr;</span> to select channel &bull; Press <span class="key-cap">PLAY</span> or <span class="key-cap">SPACEBAR</span> to sonify data
    </p>

    <div class="slideshow-wrapper">
      <div class="console-top-bar">
        <p class="slideshow-label" id="channelTitle">CH-01 // ATMOSPHERE</p>
        <span class="track-counter" id="trackCounter">01 / 03</span>
      </div>
      
      <div class="slideshow-container">
        <div class="mySlides1" data-title="CH-01 // ATMOSPHERE">
          <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 1">
          <button class="playButn" type="button" onclick="triggerPattern(1, [261.63, 329.63, 392.00, 523.25])">
            &#9654; Play Ch-01
          </button>
        </div>

        <div class="mySlides1" data-title="CH-02 // BIOSPHERE">
          <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 2">
          <button class="playButn" type="button" onclick="triggerPattern(2, [293.66, 369.99, 440.00, 587.33])">
            &#9654; Play Ch-02
          </button>
        </div>

        <div class="mySlides1" data-title="CH-03 // HYDROSPHERE">
          <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 3">
          <button class="playButn" type="button" onclick="triggerPattern(3, [329.63, 415.30, 493.88, 659.25])">
            &#9654; Play Ch-03
          </button>
        </div>

        <a class="prev" onclick="plusSlides(-1, 0)" title="Previous Channel">&#10094;</a>
        <a class="next" onclick="plusSlides(1, 0)" title="Next Channel">&#10095;</a>
      </div>

      <div class="console-bottom-bar">
        <span class="status-text" id="statusReadout">READY &bull; AWAITING INPUT</span>
        <div class="equalizer" id="equalizer">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <p>&copy; 2026 Crew Platina // Earth Information Jukebox &bull; Insert Disc to Continue</p>
  </footer>

  <script>
    let slideIndex = [1];
    let slideId = ["mySlides1"];
    let audioCtx = null;
    let eqTimeout = null;

    showSlides(1, 0);

    function plusSlides(n, no) {
      playBlip(440, 0.05);
      showSlides(slideIndex[no] += n, no);
    }

    function showSlides(n, no) {
      let x = document.getElementsByClassName(slideId[no]);
      if (!x.length) return;
      if (n > x.length) { slideIndex[no] = 1; }    
      if (n < 1) { slideIndex[no] = x.length; }
      for (let i = 0; i < x.length; i++) {
        x[i].style.display = "none";  
      }
      const currentSlide = x[slideIndex[no] - 1];
      currentSlide.style.display = "block";

      // Update HUD counter and channel name
      document.getElementById("trackCounter").textContent = 
        String(slideIndex[no]).padStart(2, '0') + " / " + String(x.length).padStart(2, '0');
      document.getElementById("channelTitle").textContent = currentSlide.dataset.title;
      document.getElementById("statusReadout").textContent = "CHANNEL LOADED // READY";
    }

    // Simple retro synthesizer chime using Web Audio API
    function playBlip(freq, duration) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerPattern(num, notes) {
      const readout = document.getElementById("statusReadout");
      const eq = document.getElementById("equalizer");
      
      readout.textContent = `PLAYING CH-0${num}...`;
      readout.style.color = "#EBEBD8";
      eq.classList.add("playing");

      notes.forEach((freq, idx) => {
        setTimeout(() => playBlip(freq, 0.18), idx * 110);
      });

      clearTimeout(eqTimeout);
      eqTimeout = setTimeout(() => {
        eq.classList.remove("playing");
        readout.textContent = `CH-0${num} COMPLETE`;
        readout.style.color = "#9BA685";
      }, 900);
    }

    // Keyboard controls for arcade feel
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") plusSlides(-1, 0);
      if (e.key === "ArrowRight") plusSlides(1, 0);
      if (e.key === " ") {
        e.preventDefault();
        const activeBtn = document.querySelector(`.mySlides1:nth-child(${slideIndex[0]}) .playButn`);
        if (activeBtn) activeBtn.click();
      }
    });
  </script>
</body>
</html>
